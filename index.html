<style>

:root{--bg:#0b1120;--panel:#141e30;--line:#28364b;--text:#edf3ff;--muted:#9baac0;--green:#39d98a;--red:#ff737e;--blue:#75aaff}

*{box-sizing:border-box}

body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.6}

header{padding:22px 5%;background:#111a2a;border-bottom:1px solid var(--line)}

.brand{font-size:25px;font-weight:800;letter-spacing:.3px}.brand span{color:var(--green)}

header p{color:var(--muted);margin:4px 0}

nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

button,select,input{font:inherit}

button,select{cursor:pointer}

nav button,.tab,.filter{background:var(--panel);color:var(--text);border:1px solid var(--line);padding:10px 14px;border-radius:10px}

nav button.active,.tab.active{background:#214c41;border-color:var(--green)}

main{max-width:1200px;margin:auto;padding:24px 5% 60px}

h1{font-size:27px;margin:0 0 6px}h2{font-size:20px;margin:0 0 14px}h3{font-size:16px;margin:0 0 8px}

.muted{color:var(--muted);font-size:13px}

.notice{padding:13px 15px;border:1px solid #715e35;background:#302719;border-radius:12px;color:#f8d99a;margin:16px 0}

.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:20px 0}

.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:17px}

.metric{font-size:25px;font-weight:800}.green{color:var(--green)}.red{color:var(--red)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}

input,select{background:#0c1423;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;min-width:0}

input{flex:1;min-width:180px}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}

table{width:100%;border-collapse:collapse;min-width:650px}

th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:14px}

th{color:var(--muted);background:#101827}

tbody tr{cursor:pointer}tbody tr:hover{background:#202c40}

.tag{display:inline-block;border-radius:6px;padding:3px 7px;background:#25344b;font-size:12px}

button.primary{background:var(--green);color:#07180f;border:0;font-weight:800;padding:11px 16px;border-radius:10px}

button:focus,input:focus,select:focus{outline:2px solid var(--blue);outline-offset:2px}

.detail{margin-top:18px}

.detailgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

.smallmetric{padding:12px;background:#0e1727;border-radius:10px;border:1px solid var(--line)}

.smallmetric b{display:block;font-size:18px}

ul{padding-left:20px}

footer{border-top:1px solid var(--line);padding:22px 5%;color:var(--muted);font-size:12px}

@media(max-width:700px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.detailgrid{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding-top:18px}.metric{font-size:21px}header{padding:18px 5%}}

@media(max-width:380px){.detailgrid{grid-template-columns:1fr}.cards{gap:8px}.card{padding:12px}}

</style>

</head>

 if(page==="etf"){market="all";type="ETF"}else if(page==="tw"){market="tw";type=type==="股票"?"股票":"全部"}else if(page==="us"){market="us";type=type==="股票"?"股票":"全部"}

 const list=filtered();

 app.innerHTML=`<h1>${page==="etf"?"ETF 專區":market==="tw"?"台股研究排行榜":"美股研究排行榜"}</h1><p class="muted">依研究示範分數排列；非即時投資建議。</p><div class="toolbar"><input id="search" placeholder="搜尋代號、名稱或產業…" value="${query.replace(/"/g,"&quot;")}"><select id="type"><option ${type==="全部"?"selected":""}>全部</option><option ${type==="股票"?"selected":""}>股票</option><option ${type==="ETF"?"selected":""}>ETF</option></select></div><div class="tabs"><button class="tab ${market==="tw"?"active":""}" onclick="setMarket('tw')">台股</button><button class="tab ${market==="us"?"active":""}" onclick="setMarket('us')">美股</button><button class="tab ${market==="all"?"active":""}" onclick="setMarket('all')">全部市場</button></div>${table(list)}<div id="detail">${detail(assets.find(a=>a.symbol===selected)||list[0])}</div>`;

function smartInvestAnalyze(a) {
  const num = (...keys) => {
    for (const k of keys) {
      const v = Number(a[k]);
      if (a[k] !== undefined && a[k] !== null &&
          a[k] !== "" && Number.isFinite(v)) return v;
    }
    return null;
  };

  const price = num("price", "currentPrice", "close");
  const pe = num("pe", "PER", "per");
  const roe = num("roe", "ROE");
  const growth = num("growth", "revenueGrowth");
  const debt = num("debtRatio", "debt");
  const dividend = num("dividendYield", "yield");
  const eps = num("eps", "EPS");
  const fairValue = num("fairValue", "targetPrice");

  let score = 50;
  const reasons = [];
  const risks = [];
  let available = 0;

  if (roe !== null) {
    available++;
    score += roe >= 15 ? 12 : roe >= 10 ? 6 :
             roe < 0 ? -15 : 0;
    reasons.push("已納入股東權益報酬率");
    if (roe < 8) risks.push("獲利效率偏低");
  }

  if (growth !== null) {
    available++;
    score += growth >= 15 ? 12 : growth > 0 ? 5 :
             growth < 0 ? -12 : 0;
    reasons.push("已納入成長率");
    if (growth < 0) risks.push("成長率為負");
  }

  if (pe !== null && pe > 0) {
    available++;
    score += pe <= 15 ? 8 : pe <= 25 ? 3 :
             pe > 40 ? -10 : 0;
    reasons.push("已納入本益比");
    if (pe > 40) risks.push("本益比偏高，須檢查估值");
  }

  if (debt !== null) {
    available++;
    score += debt < 30 ? 5 : debt > 70 ? -10 : 0;
    reasons.push("已納入負債比率");
    if (debt > 70) risks.push("負債比率偏高");
  }

  if (dividend !== null) {
    available++;
    if (dividend < 0 || dividend > 15)
      risks.push("股息殖利率異常，請核對資料");
    else if (dividend >= 2 && dividend <= 6)
      score += 3;
  }

  score = Math.max(0, Math.min(100, score));
  const confidence = available >= 4 ? "較完整" :
                     available >= 2 ? "有限" : "不足";

  let conclusion = "資料不足，暫不判斷";
  if (available >= 2) {
    conclusion = score >= 75 ? "基本面條件較佳，仍須評估價格" :
                 score >= 60 ? "中性偏正面，等待更多證據" :
                 score >= 45 ? "審慎觀察" : "風險偏高，應深入檢查";
  }

  let valuation = "缺少合理價資料，無法計算安全邊際";
  let margin = null;

  if (price !== null && price > 0 &&
      fairValue !== null && fairValue > 0) {
    margin = (fairValue - price) / fairValue * 100;
    valuation = margin >= 20 ? "相對合理價有安全邊際" :
                margin >= 0 ? "低於估計合理價，但安全邊際有限" :
                "高於估計合理價";
  } else if (price !== null && price > 0 &&
             eps !== null && eps > 0 &&
             pe !== null && pe > 0) {
    valuation = "已有估值資料，但仍需獨立估算合理價";
  }

  if (available < 3)
    risks.push("可用基本面資料不足，評分可信度有限");

  return {
    score,
    confidence,
    conclusion,
    valuation,
    margin: margin === null ? null :
            Math.round(margin * 100) / 100,
    reasons,
    risks
  };
}
