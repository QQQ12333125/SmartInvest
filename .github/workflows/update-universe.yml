name: Refresh market symbol database
on:
  workflow_dispatch:
  schedule:
    - cron: '17 22 * * 1-5' # weekday schedule, UTC
  push:
    paths:
      - 'scripts/build_universe.py'
      - '.github/workflows/update-universe.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build symbol database
        run: python scripts/build_universe.py
      - name: Commit refreshed database
        run: |
          # Keep the newly generated database, then sync any commits made while the
          # long-running data build was in progress.
          cp universe.json /tmp/universe-generated.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/universe-generated.json universe.json

          if git diff --quiet -- universe.json; then
            echo 'No universe changes.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add universe.json
            git commit -m 'Refresh full market symbol database'
            git push origin HEAD:main
          fi
